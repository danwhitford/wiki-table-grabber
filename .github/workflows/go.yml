name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check vendor directory is up to date
      run: |
        go mod vendor
        git diff --exit-code -- vendor go.mod go.sum
        test -z "$(git status --porcelain -- vendor)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v -race ./...

    - name: Build
      run: env GOOS=darwin GOARCH=amd64 go build -v .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wiki-table-grabber
        path: wiki-table-grabber
